<!doctype html>
<html lang="en" style="background:#141414;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkord</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      }
      #loading-screen.hidden {
        display: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        margin-top: 20px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Loading Sharkord...</div>
    </div>
    <div id="portal"></div>
    <div id="imagePortal"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <script>
      window.hideLoadingScreen = function() {
        const screen = document.getElementById('loading-screen');
        if (screen) {
          screen.classList.add('hidden');
        }
      };
      // Show error if app hasn't mounted after 12 seconds
      setTimeout(function() {
        const screen = document.getElementById('loading-screen');
        if (screen && !screen.classList.contains('hidden')) {
          const text = screen.querySelector('.loading-text');
          if (text) {
            text.textContent = 'Failed to load. Press F12 to open DevTools and check the Console tab for errors.';
            text.style.color = '#f87171';
            text.style.maxWidth = '400px';
            text.style.textAlign = 'center';
          }
          const spinner = screen.querySelector('.spinner');
          if (spinner) spinner.style.display = 'none';
        }
      }, 12000);
    </script>
  </body>
</html>
